services:
  discovery-server:
    build: ./infra/discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 25

  config-server:
    build: ./infra/config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - --header='Accept: application/json'
          http://discovery-server:8761/eureka/apps/CONFIG-SERVER
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/

  user-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_users"]
      interval: 5s
      timeout: 3s
      retries: 15

  event-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_events"]
      interval: 5s
      timeout: 3s
      retries: 15

  request-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - request-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_requests"]
      interval: 5s
      timeout: 3s
      retries: 15

  additional-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_additional
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - additional-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_additional"]
      interval: 5s
      timeout: 3s
      retries: 15

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm-stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm-stats"]
      interval: 5s
      timeout: 3s
      retries: 15

  user-service:
    build: ./core/user-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      USER_DB_URL: jdbc:postgresql://user-db:5432/ewm_users
      USER_DB_USER: postgres
      USER_DB_PASSWORD: postgres

  event-service:
    build: ./core/event-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      event-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      EVENT_DB_URL: jdbc:postgresql://event-db:5432/ewm_events
      EVENT_DB_USER: postgres
      EVENT_DB_PASSWORD: postgres

  request-service:
    build: ./core/request-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      request-db:
        condition: service_healthy
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      REQUEST_DB_URL: jdbc:postgresql://request-db:5432/ewm_requests
      REQUEST_DB_USER: postgres
      REQUEST_DB_PASSWORD: postgres

  additional-service:
    build: ./core/additional-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      additional-db:
        condition: service_healthy
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      ADDITIONAL_DB_URL: jdbc:postgresql://additional-db:5432/ewm_additional
      ADDITIONAL_DB_USER: postgres
      ADDITIONAL_DB_PASSWORD: postgres

  stats-server:
    build: ./statistics-service/statistics-service-server
    depends_on:
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/ewm-stats
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  gateway-server:
    build: ./infra/gateway-server
    depends_on:
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      request-service:
        condition: service_started
      additional-service:
        condition: service_started
      stats-server:
        condition: service_started
      config-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/

volumes:
  user-db-data:
  event-db-data:
  request-db-data:
  additional-db-data:
  stats-db-data:
