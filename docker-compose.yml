services:
  discovery-server:
    build: ./infra/discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 25

  config-server:
    build: ./infra/config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - --header='Accept: application/json'
          http://discovery-server:8761/eureka/apps/CONFIG-SERVER
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s
    environment:
      EUREKA_INSTANCE_ID: config-server-1
      EUREKA_URI: http://discovery-server:8761/eureka/

  # Stage 3: Kafka in single-node KRaft mode (local development only).
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      CLUSTER_ID: "LYgyN-ShR3ylKux56h9mfw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Create the two required topics only after the broker is healthy.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1.DLT --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1.DLT --partitions 3 --replication-factor 1
        kafka-configs --bootstrap-server kafka:29092 --entity-type topics --entity-name stats.user-actions.v1 --alter --add-config retention.ms=-1
        kafka-topics --bootstrap-server kafka:29092 --describe --topic stats.user-actions.v1
        kafka-topics --bootstrap-server kafka:29092 --describe --topic stats.events-similarity.v1


  collector:
    build: ./statistics-service/statistics-service-collector
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_ID: collector-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # Stage 3: computes similarities from actions and publishes Avro results.
  aggregator:
    build: ./statistics-service/statistics-service-aggregator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_ID: aggregator-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # Stage 3: recommendation API and persistent interaction/similarity state.
  analyzer:
    build: ./statistics-service/statistics-service-analyzer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      analyzer-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANALYZER_DB_HOST: analyzer-db
      ANALYZER_DB_NAME: ewm_recommendations
      ANALYZER_DB_USER: postgres
      ANALYZER_DB_PASSWORD: postgres

  analyzer-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_recommendations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - analyzer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_recommendations"]
      interval: 5s
      timeout: 3s
      retries: 15

  user-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_users"]
      interval: 5s
      timeout: 3s
      retries: 15

  event-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_events"]
      interval: 5s
      timeout: 3s
      retries: 15

  request-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - request-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_requests"]
      interval: 5s
      timeout: 3s
      retries: 15

  category-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_category
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - category-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_category"]
      interval: 5s
      timeout: 3s
      retries: 15


  compilation-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_compilation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5441:5432"
    volumes:
      - compilation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_compilation"]
      interval: 5s
      timeout: 3s
      retries: 15


  comment-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_comment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm_comment"]
      interval: 5s
      timeout: 3s
      retries: 15

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm-stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm-stats"]
      interval: 5s
      timeout: 3s
      retries: 15

  user-service:
    build: ./core/user-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_ID: user-service-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      USER_DB_URL: jdbc:postgresql://user-db:5432/ewm_users
      USER_DB_USER: postgres
      USER_DB_PASSWORD: postgres

  event-service:
    build: ./core/event-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      event-db:
        condition: service_healthy
      stats-server:
        condition: service_started
      analyzer:
        condition: service_started
      collector:
        condition: service_started
    environment:
      EUREKA_INSTANCE_ID: event-service-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      EVENT_DB_URL: jdbc:postgresql://event-db:5432/ewm_events
      EVENT_DB_USER: postgres
      EVENT_DB_PASSWORD: postgres

  request-service:
    build: ./core/request-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      request-db:
        condition: service_healthy
      collector:
        condition: service_started
    environment:
      EUREKA_INSTANCE_ID: request-service-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      REQUEST_DB_URL: jdbc:postgresql://request-db:5432/ewm_requests
      REQUEST_DB_USER: postgres
      REQUEST_DB_PASSWORD: postgres

  category-service:
    build: ./core/category-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      category-db:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_ID: category-service-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      CATEGORY_DB_URL: jdbc:postgresql://category-db:5432/ewm_category
      CATEGORY_DB_USER: postgres
      CATEGORY_DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://category-db:5432/ewm_category
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


  compilation-service:
    build: ./core/compilation-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      compilation-db:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_ID: compilation-service-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      COMPILATION_DB_URL: jdbc:postgresql://compilation-db:5432/ewm_compilation
      COMPILATION_DB_USER: postgres
      COMPILATION_DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://compilation-db:5432/ewm_compilation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


  comment-service:
    build: ./core/comment-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      comment-db:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_ID: comment-service-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      COMMENT_DB_URL: jdbc:postgresql://comment-db:5432/ewm_comment
      COMMENT_DB_USER: postgres
      COMMENT_DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/ewm_comment
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  stats-server:
    build: ./statistics-service/statistics-service-server
    depends_on:
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_ID: stats-server-1
      EUREKA_URI: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/ewm-stats
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  gateway-server:
    build: ./infra/gateway-server
    depends_on:
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      request-service:
        condition: service_started
      category-service:
        condition: service_started
      compilation-service:
        condition: service_started
      comment-service:
        condition: service_started
      stats-server:
        condition: service_started
      config-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      EUREKA_INSTANCE_ID: gateway-server-1
      EUREKA_URI: http://discovery-server:8761/eureka/

volumes:
  analyzer-db-data:
  user-db-data:
  event-db-data:
  request-db-data:
  category-db-data:
  compilation-db-data:
  comment-db-data:
  additional-db-data:
  stats-db-data:
  kafka-data:
