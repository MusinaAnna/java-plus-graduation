server.port=8080
management.endpoints.web.exposure.include=health,info,gateway
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=user-service-api
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/users/**
spring.cloud.gateway.routes[0].order=0
spring.cloud.gateway.routes[1].id=request-service-api
spring.cloud.gateway.routes[1].uri=lb://request-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/*/requests/**,/users/*/events/*/requests/**
spring.cloud.gateway.routes[1].order=1
spring.cloud.gateway.routes[2].id=additional-service-api
spring.cloud.gateway.routes[2].uri=lb://additional-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/admin/categories/**,/categories/**,/admin/compilations/**,/compilations/**,/admin/comments/**,/users/*/comments/**,/events/*/comments/**
spring.cloud.gateway.routes[2].order=2
spring.cloud.gateway.routes[3].id=event-service-api
spring.cloud.gateway.routes[3].uri=lb://event-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/admin/events/**,/users/*/events/**,/events/**
spring.cloud.gateway.routes[3].order=3
spring.cloud.gateway.routes[4].id=stats-server-api
spring.cloud.gateway.routes[4].uri=lb://stats-server
spring.cloud.gateway.routes[4].predicates[0]=Path=/hit,/stats/**
spring.cloud.gateway.routes[4].order=4

spring.cloud.gateway.x-forwarded.for-enabled=true
spring.cloud.gateway.x-forwarded.for-append=true
