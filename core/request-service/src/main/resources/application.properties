spring.application.name=request-service
spring.config.import=configserver:
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=15
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=4000
spring.cloud.config.retry.multiplier=1.4
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
management.endpoints.web.exposure.include=health,info
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=25s
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=ru.practicum.common.exception.BadRequestException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[1]=ru.practicum.common.exception.ConflictException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[2]=ru.practicum.common.exception.ForbiddenException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[3]=ru.practicum.common.exception.NotFoundException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[4]=ru.practicum.common.exception.ValidationException
