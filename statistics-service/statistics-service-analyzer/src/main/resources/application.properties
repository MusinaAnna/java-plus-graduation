spring.application.name=analyzer
spring.config.import=configserver:
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=15
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=4000
spring.cloud.config.retry.multiplier=1.4
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
server.port=0
grpc.server.port=0
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.datasource.url=jdbc:postgresql://${ANALYZER_DB_HOST:localhost}:${ANALYZER_DB_PORT:5432}/${ANALYZER_DB_NAME:ewm_recommendations}
spring.datasource.username=${ANALYZER_DB_USER:postgres}
spring.datasource.password=${ANALYZER_DB_PASSWORD:postgres}
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info
